# SonarCloud automatic analysis.
# The app is in src/. Everything in scripts/ is test and tooling code that runs on a developer's
# machine (headless-browser tests, the launch kit): it writes screenshots to /tmp by design and
# should be judged as tests, not as shipped code.
sonar.sources=src
sonar.tests=scripts
sonar.exclusions=android/**,out/**,.next/**,docs/**

name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # GitHub's Ubuntu runners already ship the Android SDK with licences accepted; Gradle fetches any
      # missing platform itself. (The separate setup action started failing on a missing "tools" package.)
      - run: npm ci
      - run: npm run check
      - run: PIXI_TARGET=app npx next build
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: pixi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
